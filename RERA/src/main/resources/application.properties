# Example (replace with your actual Aiven values):
# spring.datasource.url=jdbc:postgresql://pg-rera-yourproject.aivencloud.com:12345/defaultdb?sslmode=require
# spring.datasource.username=avnadmin
# spring.datasource.password=AVNS_xxxxxxxxxxxxxxxx

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
# Flyway manages the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Server ---
server.port=8383

# --- AI Microservice ---
ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}

# --- File Storage ---
file-storage.upload-dir=${UPLOAD_DIR:./uploads}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.schema=INFO
logging.level.org.hibernate.tool.schema=INFO
logging.level.org.springframework.orm.jpa=INFO

