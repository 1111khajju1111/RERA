spring.application.name=RERA
# ============================================
# RERA AUDITOR AI - Application Configuration
# PostgreSQL (Local / Aiven) Integration
# ============================================
# --- PostgreSQL Connection ---
# Replace the values below with your actual PostgreSQL credentials
# For Aiven: Aiven Console > Your Service > Connection Information
spring.datasource.url=${DB_URL}
# ^ No default on purpose — the app should fail loudly at startup if this
# isn't set rather than silently connecting nowhere. Set it to the FULL
# JDBC URL including SSL params, e.g.:
# jdbc:mysql://<host>:<port>/<db>?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Example (replace with your actual Aiven values):
# spring.datasource.url=jdbc:postgresql://pg-rera-yourproject.aivencloud.com:12345/defaultdb?sslmode=require
# spring.datasource.username=avnadmin
# spring.datasource.password=AVNS_xxxxxxxxxxxxxxxx

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
# NOTE: ddl-auto is "update", not "validate" — Hibernate can also
# auto-modify the schema alongside Flyway's migrations. Known latent
# risk (the two can conflict); left as-is rather than flipped to
# "validate" to avoid surfacing a currently-hidden mapping mismatch on
# an otherwise-working deployment. Switch deliberately, tested against
# a non-production DB first.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Server ---
server.port=${PORT:8383}
# Render terminates HTTPS at its edge and forwards plain HTTP internally —
# this tells Spring Boot to trust X-Forwarded-* headers so it correctly
# knows the original request was HTTPS (affects redirect/scheme handling).
server.forward-headers-strategy=framework

# --- AI Microservice ---
ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}

# --- File Storage ---
file-storage.upload-dir=${UPLOAD_DIR:./uploads}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.schema=INFO
logging.level.org.hibernate.tool.schema=INFO
logging.level.org.springframework.orm.jpa=INFO
# Removed: jwt.secret / jwt.expiration (unused anywhere in code — auth is
# bearer-token via auth_tokens table, not JWT — and a hardcoded secret
# shouldn't sit in a committed properties file regardless).
# Removed: server.servlet.session.cookie.* (meaningless now — STATELESS
# auth never creates an HTTP session, so no session cookie is ever issued).